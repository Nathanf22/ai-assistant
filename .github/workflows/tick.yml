name: Scheduler tick

# Calls the production scheduler (/api/tick), since Vercel Hobby crons run only once a day.
# GitHub runs scheduled workflows every 5 minutes at best, sometimes late: fine for the test phase.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PRODUCTION_URL }}/api/tick"
